[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herbert-nn"
version = "0.1.0"
description = "Herbert /nn: behavioral-cloning neural network training pipeline for Hypixel Bridge duels (feasibility experiment)."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [{ name = "Herbert project contributors" }]
keywords = ["imitation-learning", "behavioral-cloning", "minecraft", "hypixel", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2,<3.0",
    "pydantic>=2.5,<3.0",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "tensorboard>=2.15,<3.0",
    "matplotlib>=3.7,<4.0",
    "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16,<1.0"]
dev = [
    "pytest>=7.4,<9.0",
    "ruff>=0.4,<1.0",
    "black>=24.0,<25.0",
    "mypy>=1.8,<2.0",
]

[project.scripts]
herbert-nn-preprocess = "herbert_nn.preprocess:main"
herbert-nn-train = "herbert_nn.train:main"
herbert-nn-evaluate = "herbert_nn.evaluate:main"
herbert-nn-inspect = "herbert_nn.inspect:main"
herbert-nn-smoketest = "herbert_nn.smoketest:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["herbert_nn*"]

# NOTE: Hydra configs live in `conf/` at the project root (sibling of `src/`),
# not inside the installed package -- this project is intended to be used
# from a git checkout via `pip install -e .`, run from the `nn/` directory
# (see README.md). `herbert_nn.train` locates `conf/` relative to its own
# source file, so this works regardless of the caller's cwd.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["herbert_nn"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["tests/", "conf/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
